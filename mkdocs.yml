site_name: VKBOTS Wiki
site_description: Developer documentation for VK BOTS, the VKH6 humanoid robot, joint actuators, and ROS 2 control systems.
site_url: https://Ditshk.github.io/vkbots-wiki/
copyright: Copyright &copy; 2026 VKBOTS

theme:
  name: material
  custom_dir: overrides
  logo: assets/other/logo.png
  favicon: assets/other/vkbots-favicon.png
  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ditshk/vkbots-wiki

repo_name: Ditshk/vkbots-wiki
repo_url: https://github.com/Ditshk/vkbots-wiki
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/locale-preference.js

plugins:
  - search
  - privacy:
      assets: false
      links_attr_map:
        target: _blank
  - redirects
  - mkdocs-video:
      is_video: true
      css_style:
        width: "100%"
        height: auto
  - glightbox
  - minify:
      minify_html: true
  - awesome-nav

hooks:
  - hooks/redirect_empty_sections.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
